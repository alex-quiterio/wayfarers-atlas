<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b1424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Set the mode before first paint, so there is no flash. Night is the default. */
      try {
        var m = localStorage.getItem("atlas-theme");
        document.documentElement.dataset.theme = m === "day" ? "day" : "night";
      } catch (e) {
        document.documentElement.dataset.theme = "night";
      }
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/search.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <canvas id="map" aria-label="Map of the notes"></canvas>

    <header class="topbar">
      <button id="menu" class="seal-btn" type="button" data-icon="menu" aria-label="Open the atlas panel"></button>
      <h1 class="topbar__title"></h1>
      <div class="search">
        <input id="search" type="search" placeholder="Search notes, people, lands…" autocomplete="off" />
        <ul id="results" class="search__results" hidden></ul>
      </div>
      <button id="theme" class="seal-btn" type="button" data-icon="sun" aria-label="Switch between night and day" title="Switch between night and day"></button>
      <button id="refresh" class="seal-btn" type="button" data-icon="refresh" aria-label="Refresh to the latest atlas" title="Refresh to the latest atlas"></button>
      <button id="install" class="seal-btn" type="button" data-icon="install" hidden aria-label="Install as an app" title="Install as an app"></button>
    </header>

    <div id="tooltip" class="tooltip" hidden></div>

    <div class="zoom">
      <button id="zoom-in" class="seal-btn" type="button" data-icon="plus" aria-label="Zoom in"></button>
      <button id="zoom-out" class="seal-btn" type="button" data-icon="minus" aria-label="Zoom out"></button>
      <button id="zoom-home" class="seal-btn" type="button" data-icon="home" aria-label="Show the whole map"></button>
    </div>

    <aside id="panel" class="panel" aria-live="polite"></aside>

    <noscript>This map needs JavaScript.</noscript>
    <script src="atlas-data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
